name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify bundled Chinese font
        run: |
          # 中文渲染修复的守门员。背景：Kivy 自带 Roboto 不含任何汉字，
          # 若不替换默认字体，界面上所有中文都会渲染成"带叉的空方框"。
          # 修复依赖仓库里的 fonts/WenQuanYiMicroHei.ttc 被打进 APK，
          # 而它是个 5MB 的二进制文件 —— 一旦被 .gitignore 误伤、LFS 配置出错
          # 或提交时漏掉，构建照样"成功"，只是装到手机上中文全变方框，
          # 极难排查。所以这里在花十几分钟编译之前先做硬校验，快速失败。
          set -euo pipefail
          FONT="fonts/WenQuanYiMicroHei.ttf"
          if [ ! -f "$FONT" ]; then
            FONT="fonts/WenQuanYiMicroHei.ttc"
          fi
          if [ ! -f "$FONT" ]; then
            echo "::error::缺少中文字体（ttf / ttc 均未找到）—— APK 将无法渲染中文"
            exit 1
          fi
          echo "使用字体: $FONT"
          SIZE=$(stat -c%s "$FONT")
          echo "字体文件大小: $SIZE 字节"
          # 已知完整字体为 4.6MB(ttf) / 5.1MB(ttc)。小于 4MB 说明下载/提交被截断
          # （本项目历史上就踩过这个坑：2.9MB 的半截文件结构看似正常）。
          if [ "$SIZE" -lt 4000000 ]; then
            echo "::error::$FONT 只有 $SIZE 字节，疑似被截断"
            exit 1
          fi
          # 确认字体能被解析、且真的含汉字，而不是只有拉丁字形的假字体。
          python -m pip install --quiet fonttools
          FONT_PATH="$FONT" python - <<'PY'
          import os, sys
          from fontTools.ttLib import TTFont, TTCollection
          path = os.environ["FONT_PATH"]
          if path.endswith(".ttc"):
              cmaps = [set(f.getBestCmap().keys()) for f in TTCollection(path).fonts]
          else:
              cmaps = [set(TTFont(path).getBestCmap().keys())]
          print(f"字体份数: {len(cmaps)}, 码点数: {[len(m) for m in cmaps]}")
          probe = "批量重命名选择文件夹插入序号预览执行撤销"
          missing = sorted({c for c in probe if not any(ord(c) in m for m in cmaps)})
          if missing:
              print(f"::error::字体缺少汉字字形: {missing}")
              sys.exit(1)
          print("字体校验通过：中文可正常渲染")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          # 注意：这里刻意【不】安装 libsdl2-dev 等宿主 SDL2 开发库。
          # 原因：交叉编译 kivy 的 C 扩展时，宿主的 pkg-config 会把
          # /usr/include/SDL2、/usr/include/x86_64-linux-gnu 等宿主 glibc 头文件路径
          # 注入到 clang 命令行里，导致 NDK 的 assert.h 引到宿主 glibc 的
          # sys/cdefs.h，报 "__GNUC_PREREQ is not defined"。
          # SDL2 的头文件由 python-for-android 的 bootstrap 自己提供，无需宿主安装。
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            pkgconf \
            build-essential \
            make \
            gcc \
            g++ \
            libffi-dev \
            zlib1g-dev \
            libssl-dev \
            python3-pip \
            python3-dev \
            git \
            openjdk-17-jdk \
            autoconf-archive \
            gettext \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            tk-dev \
            libdb-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          # 钉死 cython：p4a v2024.01.21（下方 buildozer.spec 里指定的版本）
          # 是 Cython 0.29 时代的代码，用 Cython 3.x 编译它的 .pyx 会因
          # 语言语义变更（如 __index__ 严格化、类型注解处理差异）报错。
          # 0.29.37 是该系列最后一个稳定版。
          python -m pip install "cython==0.29.37"

      - name: Install Buildozer
        run: |
          # 钉死 buildozer：1.5.0 是长期稳定版，与本项目的 buildozer.spec
          # 字段、p4a 调用方式完全兼容。不钉版本的话，上游一旦发布破坏性
          # 更新（比如改掉 spec 字段名、换默认 p4a 分支），CI 会在你完全
          # 没动代码的情况下突然变红，排查起来极其费劲。
          python -m pip install "buildozer==1.5.0"

      - name: Run tests
        run: |
          # 先装 pytest，跑核心逻辑单元测试。
          # 放在 Build APK 之前：测试挂了就直接 fail，不用白等十几分钟的安卓构建。
          python -m pip install pytest
          python -m pytest tests -v


      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          # key 里加 v4：本次钉死了 cython（0.29.37）与 buildozer（1.5.0），
          # 构建产物与之前不同，旧缓存里的中间产物必须全部失效。
          # 历史上 v3 那次是把 p4a 从 master(3.14.2) 钉到 v2024.01.21(3.11.5)，
          # 旧缓存存的是 3.14.2 编译的 hostpython/venv，命中会导致版本不切换。
          key: buildozer-global-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-v4-

      # ⚠️ 顺序很重要：缓存恢复必须在预克隆「之前」。
      # 否则缓存会把 ~/.buildozer 整体覆盖回去，把刚 clone 好的 p4a 冲掉，
      # 下面那步的版本校验也就白做了。
      - name: Pre-clone python-for-android (with retry)
        env:
          P4A_BRANCH: v2024.01.21
        run: |
          # 为什么要手动预克隆：
          #   p4a 由 buildozer 在构建过程中自己 git clone，那段代码没有重试逻辑。
          #   GitHub 到 github.com 的 clone 偶尔会因网络抖动失败（
          #   "fatal: unable to access ... SSL_ERROR_SYSCALL" / "early EOF"），
          #   一失败整个构建就挂，重跑一次又要等几十分钟。
          #   所以这里提前 clone 好，buildozer 检测到目录已存在就会直接复用。
          set -u
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"

          # 已经是对的版本就直接跳过（缓存命中时走这条路）
          if [ -d "$P4A_DIR/.git" ]; then
            CURRENT=$(git -C "$P4A_DIR" describe --tags --always 2>/dev/null || echo "unknown")
            echo "== existing p4a: $CURRENT =="
            if [ "$CURRENT" = "$P4A_BRANCH" ]; then
              echo "== already at $P4A_BRANCH, skip clone =="
              exit 0
            fi
            echo "== wrong branch ($CURRENT != $P4A_BRANCH), removing =="
            rm -rf "$P4A_DIR"
          fi

          mkdir -p "$(dirname "$P4A_DIR")"

          MAX_ATTEMPTS=4
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "===== p4a clone attempt $i / $MAX_ATTEMPTS ====="
            rm -rf "$P4A_DIR"
            if git clone --depth 1 --branch "$P4A_BRANCH" \
                 https://github.com/kivy/python-for-android.git "$P4A_DIR"; then
              echo "===== clone succeeded on attempt $i ====="
              echo "== p4a HEAD =="
              git -C "$P4A_DIR" log -1 --oneline
              # 顺手校验：确认拿到的确实是 Python 3.11.x，不是 3.14
              if grep -rq '3\.14' \
                   "$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py" 2>/dev/null; then
                echo "!! WARNING: hostpython3 is 3.14.x, branch pin did not take effect"
                exit 1
              fi
              echo "== hostpython3 version check passed (not 3.14) =="
              exit 0
            fi
            echo "!! attempt $i failed, backing off..."
            sleep $((i * 15))
          done

          echo "!! p4a clone failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Restore fixed debug keystore
        run: |
          # 【固定签名·第 1 层】
          # 背景：CI 每次都跑在全新的 runner 上，~/.android/debug.keystore 不存在时，
          # python-for-android 会现场随机生成一个 debug key。于是每个版本 APK 的签名
          # 都不一样，真机覆盖安装必报 INSTALL_FAILED_UPDATE_INCOMPATIBLE (-7)，
          # 只能先卸载旧版（会清空 App 内部数据）。
          # 对策：把仓库里固定的 debug keystore 放到 p4a 期望的位置。
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -f signing/debug.keystore ]; then
            cp -f signing/debug.keystore "$HOME/.android/debug.keystore"
            echo "== 已启用仓库内固定 keystore =="
          else
            echo "::error::缺少 signing/debug.keystore —— 构建出的 APK 签名会随机，无法覆盖安装"
            exit 1
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E 'androiddebugkey|SHA1'

      - name: Cache Gradle user home (wrapper + dependency cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          # 单独一套 key 空间：Gradle 用户目录与 ~/.buildozer 无关，
          # 混在一起会让任一侧的改动同时废掉两侧缓存。
          # restore-keys 用前缀，保证第一次跑也能吃到最近的旧缓存。
          key: gradle-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            gradle-v1-

      - name: Patch cached Gradle project to add mavenCentral
        run: |
          # 【Gradle 依赖解析修复 · 第 1 层：直接改文件】
          # 结论来自两处硬证据：
          # 1) CI 日志（run 36980252657，步骤 12 Build APK）：
          #      A problem occurred configuring root project 'batchrenamer'.
          #      > Could not resolve all files for configuration ':classpath'.
          #      > Could not find org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.20-RC2
          #        Searched in the following locations:
          #          - https://dl.google.com/dl/android/maven2/...
          #          - https://jcenter.bintray.com/...
          #    另外 asm:9.2 / protobuf-java:3.19.3 / grpc-*:1.45.1 /
          #    jaxb-runtime:2.3.2 / httpmime:4.5.6 / commons-io:2.4 /
          #    javapoet:1.10.0 / gson:2.8.9 / com.squareup:javawriter:2.5.0 /
          #    com.google.code.findbugs:jsr305:3.0.2 等几十个 AGP 8.1.1 的
          #    传递依赖全部 "Could not find"。
          #    Gradle 只搜了 google 和 jcenter 两个仓库 —— 说明仓库列表里
          #    根本没有 mavenCentral()。
          # 2) 上游模板源码（kivy/python-for-android @ v2024.01.21，
          #    pythonforandroid/bootstraps/common/build/templates/build.tmpl.gradle）：
          #      buildscript {
          #          repositories { google(); jcenter() }   # ← 没有 mavenCentral
          #          dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          #      }
          #    jcenter.bintray.com 早已停服，这些构件现在只存在于 Maven Central，
          #    所以该模板如今已无法解析 AGP 的依赖。
          #
          # 为什么不能只改模板：整个 dists/ 目录（含已经生成好的 build.gradle）
          # 是从 ~/.buildozer 缓存里恢复出来的，p4a 判定 "has compatible
          # recipes, using this one" 之后不会重新渲染模板，改模板对已存在的
          # 文件无效。所以这里直接改 Gradle 真正读的那个文件：
          # dists/<name>/build.gradle，只在第一个 repositories { 块（即
          # buildscript 的仓库块）里补一行 mavenCentral()。
          set -euo pipefail
          FOUND=0
          for f in "$HOME"/.buildozer/android/platform/build-*/dists/*/build.gradle; do
            [ -f "$f" ] || continue
            FOUND=$((FOUND + 1))
            if grep -q 'mavenCentral' "$f"; then
              echo "== 已含 mavenCentral，跳过: $f =="
              continue
            fi
            cp -f "$f" "$f.bak-repos"
            sed -i '0,/repositories {/s/repositories {/repositories {\n mavenCentral()/' "$f"
            echo "== 已注入 mavenCentral: $f =="
            sed -n '1,12p' "$f"
          done
          echo "扫描到的 build.gradle 数量: $FOUND"
          # 这里故意不 fail：缓存未命中时 dists/ 还没生成，文件不存在属正常，
          # 由下一步的 Gradle init script（覆盖每一次 gradle 调用）兜底。

      - name: Install Gradle init script to force mavenCentral
        run: |
          # 【Gradle 依赖解析修复 · 第 2 层：运行时强制注入】
          # 与第 1 层互补：第 1 层改的是"缓存里已存在的 build.gradle"，
          # 若缓存未命中导致 dist 被重新生成（模板又是不带 mavenCentral 的
          # 版本），或 p4a 在构建过程中重写了 build.gradle，第 1 层就白改了。
          # 这一层用 Gradle 官方机制：$GRADLE_USER_HOME/init.d/*.gradle 会被
          # 该用户下的每一次 gradle 调用自动应用（run 日志里 Gradle 用户目录
          # 就是 /home/runner/.gradle）。它在不改 dist、不改 p4a 源码的前提下，
          # 给所有工程——包括根工程 buildscript 的 :classpath 解析——补上
          # mavenCentral()。
          set -euo pipefail
          INIT_DIR="$HOME/.gradle/init.d"
          INIT="$INIT_DIR/zz-force-maven-central.gradle"
          mkdir -p "$INIT_DIR"

          cat > "$INIT" <<'GRADLE'
          // 自动注入 Maven Central。
          // 背景：p4a v2024.01.21 生成的 build.gradle 只在 buildscript.repositories
          // 里写了 google() + jcenter()，而 jcenter 已停服、AGP 8.1.1 的传递依赖
          // 只在 Maven Central 上，导致 Gradle 配置阶段直接
          //   "Could not resolve all files for configuration ':classpath'"。
          // 这里在工程创建时（早于其 build.gradle 求值、也早于依赖解析）给
          // buildscript 仓库与工程仓库都补上 mavenCentral()。用 findByName 保护，
          // 避免与 build.gradle 里已有的同名仓库冲突。
          allprojects { project ->
              try {
                  def addIfMissing = { handler ->
            if (handler.findByName('MavenRepo') == null) {
                handler.mavenCentral()
            }
                  }
                  addIfMissing(project.buildscript.repositories)
                  addIfMissing(project.repositories)
              } catch (Throwable t) {
                  println "WARN: 注入 mavenCentral 失败（不影响其它逻辑）: ${t.message}"
              }
          }
          GRADLE

          echo "===== 已写入 $INIT ====="
          cat "$INIT"
          echo "========================"

      - name: Build APK
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_HOME ANDROID_SDK_ROOT
          # 关键修复：清空 pkg-config 的搜索路径，禁止它把宿主 Ubuntu 的头文件路径
          # （/usr/include/SDL2、/usr/include/x86_64-linux-gnu 等）返回给 kivy 的
          # setup.py，否则交叉编译时会混入宿主 glibc 头文件导致编译失败。
          export PKG_CONFIG_LIBDIR=""
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_SYSROOT_DIR=""

          # 保险 1：如果 ~/.buildozer 里残留了用 Python 3.14 编译出来的 p4a 产物，
          # 会导致 p4a.branch 不生效（p4a 已存在就不会重新 clone），脚本直接删掉。
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR" ]; then
            echo "== existing p4a detected, checking version =="
            if grep -rq '3\.14' "$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py" 2>/dev/null; then
              echo "!! found hostpython3 = 3.14.x, removing stale p4a to force re-clone"
              rm -rf "$P4A_DIR"
            fi
          fi
          # 同时清掉可能残留的 3.14 构建产物/虚拟环境，避免旧 venv 被复用
          rm -rf "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv" || true

          buildozer -v android debug
        env:
          # 双保险：即使子进程重新推导 pkg-config，也不会读到宿主配置
          PKG_CONFIG_LIBDIR: ""
          PKG_CONFIG_PATH: ""

      - name: Re-sign APK with fixed keystore
        run: |
          # 【固定签名·第 2 层】
          # 无论 p4a 最终用了哪个 key 签名，这里都剥掉旧签名、用固定 key 重签一遍。
          # 只要 signing/debug.keystore 不变，每版 APK 的签名指纹就绝对一致，
          # 真机可以直接覆盖安装，不用再卸载。
          #
          # 重要：本步骤里【不允许】出现"只看输出、判不了成败"的诊断命令。
          # build-tools 31 的 apksigner 输出 "Signer #1 certificate SHA-256 digest: ..."，
          # build-tools 37 输出 "V2 Signer: certificate SHA-256 digest: ..."。
          # 旧写法 grep 'Signer #1 certificate SHA-256 digest' 在 37 上匹配不到会返回 1，
          # 配合 set -euo pipefail 直接把整步判成失败——这正是 0.1.6 首次构建挂掉的原因。
          # 签名一致性校验挪到下一步的独立门禁里做。
          set -euo pipefail

          set -- bin/*.apk
          APK="$1"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          echo "目标 APK: $APK"

          APKSIGNER=$(find "$HOME/.buildozer" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          ZIPALIGN=$(find "$HOME/.buildozer" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          echo "zipalign: $ZIPALIGN"
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "::error::未找到 apksigner / zipalign，无法重签名"
            exit 1
          fi

          # 1) 剔掉 p4a 产生的签名文件（其余 META-INF 内容保留）
          python - "$APK" /tmp/app-stripped.apk <<'PY'
          import sys, zipfile
          src, dst = sys.argv[1], sys.argv[2]
          drop = ("META-INF/MANIFEST.MF",)
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  n = item.filename
                  if n in drop or (n.startswith("META-INF/") and n.upper().endswith((".RSA", ".DSA", ".EC", ".SF"))):
                      continue
                  zout.writestr(item, zin.read(n))
          PY

          # 2) 四字节对齐（必须在签名之前）
          "$ZIPALIGN" -p -f 4 /tmp/app-stripped.apk /tmp/app-aligned.apk

          # 3) 用固定 keystore 重签
          "$APKSIGNER" sign \
            --ks signing/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --min-sdk-version 21 \
            --out "$APK" /tmp/app-aligned.apk

          # 4) 只打印信息，绝不用来判成败（|| true 兜底）
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/certs.txt 2>&1 || true
          echo "===== apksigner verify 输出 ====="
          cat /tmp/certs.txt
          echo "================================="
          echo "重签完成：$(stat -c %s "$APK") bytes"

      - name: Verify fixed signature (gate)
        run: |
          # 【固定签名·第 3 层：硬门禁】
          # 宽松抓 SHA-256 指纹（兼容 build-tools 31 的 "Signer #1 ..." 与
          # build-tools 37 的 "V2 Signer: ..." 两种输出格式），归一化后与
          # 固定 keystore 的期望指纹严格比对；不一致就立刻让构建失败，
          # 避免把"换了签名"的 APK 传上去（那会让真机覆盖安装报 -7）。
          set -euo pipefail

          set -- bin/*.apk
          APK="$1"
          EXPECTED="0aae85a26431c8860cf61497d6337c8e6f499bad358ca4715326100cfbfb2128"

          APKSIGNER=$(find "$HOME/.buildozer" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner，无法校验签名"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" > /tmp/certs-gate.txt 2>&1 || true
          echo "===== 待校验的证书信息 ====="
          cat /tmp/certs-gate.txt
          echo "==========================="

          GOT=$(grep -Eio 'certificate SHA-256 digest[^0-9a-fA-F]*[0-9a-fA-F]{64}' /tmp/certs-gate.txt \
                  | grep -Eio '[0-9a-fA-F]{64}' | head -1 | tr 'A-Z' 'a-z') || true

          echo "期望指纹: $EXPECTED"
          echo "实际指纹: $GOT"

          if [ -z "$GOT" ]; then
            echo "::error::无法从 apksigner 输出中解析出 SHA-256 指纹"
            exit 1
          fi
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::APK 签名与固定 keystore 不一致，真机覆盖安装会报 -7，构建中止"
            exit 1
          fi

          echo "OK: 签名校验通过，APK 由固定 keystore 签名"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-renamer-apk
          path: bin/*.apk