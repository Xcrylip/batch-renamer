name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          # 确保 Buildozer 下载的 Android SDK 包含 build-tools
          buildozer -v android debug || true
          # 检查 aidl 是否存在，若不存在则尝试通过 sdkmanager 安装
          if [ ! -f ~/.buildozer/android/platform/android-sdk/build-tools/*/aidl ]; then
            echo "aidl not found, installing build-tools via sdkmanager..."
            ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "build-tools;34.0.0"
          fi
          # 重新构建
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-renamer-apk
          path: bin/*.apk