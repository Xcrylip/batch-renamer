name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          # 注意：这里刻意【不】安装 libsdl2-dev 等宿主 SDL2 开发库。
          # 原因：交叉编译 kivy 的 C 扩展时，宿主的 pkg-config 会把
          # /usr/include/SDL2、/usr/include/x86_64-linux-gnu 等宿主 glibc 头文件路径
          # 注入到 clang 命令行里，导致 NDK 的 assert.h 引到宿主 glibc 的
          # sys/cdefs.h，报 "__GNUC_PREREQ is not defined"。
          # SDL2 的头文件由 python-for-android 的 bootstrap 自己提供，无需宿主安装。
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            pkgconf \
            build-essential \
            make \
            gcc \
            g++ \
            libffi-dev \
            zlib1g-dev \
            libssl-dev \
            python3-pip \
            python3-dev \
            git \
            openjdk-17-jdk \
            autoconf-archive \
            gettext \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            tk-dev \
            libdb-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          # 不钉死 cython 版本：新版 python-for-android 需要 cython 3.x

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          # key 里加 v3：本次把 p4a 从 master(3.14.2) 钉到 v2024.01.21(3.11.5)。
          # 旧缓存里存的是用 3.14.2 编译的 hostpython/venv 等中间产物，必须让它全部失效，
          # 否则命中旧缓存会导致 p4a 源码不重新克隆、Python 版本不切换。
          key: buildozer-global-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-v3-

      - name: Build APK
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_HOME ANDROID_SDK_ROOT
          # 关键修复：清空 pkg-config 的搜索路径，禁止它把宿主 Ubuntu 的头文件路径
          # （/usr/include/SDL2、/usr/include/x86_64-linux-gnu 等）返回给 kivy 的
          # setup.py，否则交叉编译时会混入宿主 glibc 头文件导致编译失败。
          export PKG_CONFIG_LIBDIR=""
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_SYSROOT_DIR=""

          # 保险 1：如果 ~/.buildozer 里残留了用 Python 3.14 编译出来的 p4a 产物，
          # 会导致 p4a.branch 不生效（p4a 已存在就不会重新 clone），脚本直接删掉。
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR" ]; then
            echo "== existing p4a detected, checking version =="
            if grep -rq '3\.14' "$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py" 2>/dev/null; then
              echo "!! found hostpython3 = 3.14.x, removing stale p4a to force re-clone"
              rm -rf "$P4A_DIR"
            fi
          fi
          # 同时清掉可能残留的 3.14 构建产物/虚拟环境，避免旧 venv 被复用
          rm -rf "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv" || true

          buildozer -v android debug
        env:
          # 双保险：即使子进程重新推导 pkg-config，也不会读到宿主配置
          PKG_CONFIG_LIBDIR: ""
          PKG_CONFIG_PATH: ""

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-renamer-apk
          path: bin/*.apk