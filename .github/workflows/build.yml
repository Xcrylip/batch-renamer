name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          # 注意：这里刻意【不】安装 libsdl2-dev 等宿主 SDL2 开发库。
          # 原因：交叉编译 kivy 的 C 扩展时，宿主的 pkg-config 会把
          # /usr/include/SDL2、/usr/include/x86_64-linux-gnu 等宿主 glibc 头文件路径
          # 注入到 clang 命令行里，导致 NDK 的 assert.h 引到宿主 glibc 的
          # sys/cdefs.h，报 "__GNUC_PREREQ is not defined"。
          # SDL2 的头文件由 python-for-android 的 bootstrap 自己提供，无需宿主安装。
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            pkgconf \
            build-essential \
            make \
            gcc \
            g++ \
            libffi-dev \
            zlib1g-dev \
            libssl-dev \
            python3-pip \
            python3-dev \
            git \
            openjdk-17-jdk \
            autoconf-archive \
            gettext \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            tk-dev \
            libdb-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          # 钉死 cython：p4a v2024.01.21（下方 buildozer.spec 里指定的版本）
          # 是 Cython 0.29 时代的代码，用 Cython 3.x 编译它的 .pyx 会因
          # 语言语义变更（如 __index__ 严格化、类型注解处理差异）报错。
          # 0.29.37 是该系列最后一个稳定版。
          python -m pip install "cython==0.29.37"

      - name: Install Buildozer
        run: |
          # 钉死 buildozer：1.5.0 是长期稳定版，与本项目的 buildozer.spec
          # 字段、p4a 调用方式完全兼容。不钉版本的话，上游一旦发布破坏性
          # 更新（比如改掉 spec 字段名、换默认 p4a 分支），CI 会在你完全
          # 没动代码的情况下突然变红，排查起来极其费劲。
          python -m pip install "buildozer==1.5.0"

      - name: Run tests
        run: |
          # 先装 pytest，跑核心逻辑单元测试。
          # 放在 Build APK 之前：测试挂了就直接 fail，不用白等十几分钟的安卓构建。
          python -m pip install pytest
          python -m pytest tests -v


      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          # key 里加 v4：本次钉死了 cython（0.29.37）与 buildozer（1.5.0），
          # 构建产物与之前不同，旧缓存里的中间产物必须全部失效。
          # 历史上 v3 那次是把 p4a 从 master(3.14.2) 钉到 v2024.01.21(3.11.5)，
          # 旧缓存存的是 3.14.2 编译的 hostpython/venv，命中会导致版本不切换。
          key: buildozer-global-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-v4-

      # ⚠️ 顺序很重要：缓存恢复必须在预克隆「之前」。
      # 否则缓存会把 ~/.buildozer 整体覆盖回去，把刚 clone 好的 p4a 冲掉，
      # 下面那步的版本校验也就白做了。
      - name: Pre-clone python-for-android (with retry)
        env:
          P4A_BRANCH: v2024.01.21
        run: |
          # 为什么要手动预克隆：
          #   p4a 由 buildozer 在构建过程中自己 git clone，那段代码没有重试逻辑。
          #   GitHub 到 github.com 的 clone 偶尔会因网络抖动失败（
          #   "fatal: unable to access ... SSL_ERROR_SYSCALL" / "early EOF"），
          #   一失败整个构建就挂，重跑一次又要等几十分钟。
          #   所以这里提前 clone 好，buildozer 检测到目录已存在就会直接复用。
          set -u
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"

          # 已经是对的版本就直接跳过（缓存命中时走这条路）
          if [ -d "$P4A_DIR/.git" ]; then
            CURRENT=$(git -C "$P4A_DIR" describe --tags --always 2>/dev/null || echo "unknown")
            echo "== existing p4a: $CURRENT =="
            if [ "$CURRENT" = "$P4A_BRANCH" ]; then
              echo "== already at $P4A_BRANCH, skip clone =="
              exit 0
            fi
            echo "== wrong branch ($CURRENT != $P4A_BRANCH), removing =="
            rm -rf "$P4A_DIR"
          fi

          mkdir -p "$(dirname "$P4A_DIR")"

          MAX_ATTEMPTS=4
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "===== p4a clone attempt $i / $MAX_ATTEMPTS ====="
            rm -rf "$P4A_DIR"
            if git clone --depth 1 --branch "$P4A_BRANCH" \
                 https://github.com/kivy/python-for-android.git "$P4A_DIR"; then
              echo "===== clone succeeded on attempt $i ====="
              echo "== p4a HEAD =="
              git -C "$P4A_DIR" log -1 --oneline
              # 顺手校验：确认拿到的确实是 Python 3.11.x，不是 3.14
              if grep -rq '3\.14' \
                   "$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py" 2>/dev/null; then
                echo "!! WARNING: hostpython3 is 3.14.x, branch pin did not take effect"
                exit 1
              fi
              echo "== hostpython3 version check passed (not 3.14) =="
              exit 0
            fi
            echo "!! attempt $i failed, backing off..."
            sleep $((i * 15))
          done

          echo "!! p4a clone failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Build APK
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_HOME ANDROID_SDK_ROOT
          # 关键修复：清空 pkg-config 的搜索路径，禁止它把宿主 Ubuntu 的头文件路径
          # （/usr/include/SDL2、/usr/include/x86_64-linux-gnu 等）返回给 kivy 的
          # setup.py，否则交叉编译时会混入宿主 glibc 头文件导致编译失败。
          export PKG_CONFIG_LIBDIR=""
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_SYSROOT_DIR=""

          # 保险 1：如果 ~/.buildozer 里残留了用 Python 3.14 编译出来的 p4a 产物，
          # 会导致 p4a.branch 不生效（p4a 已存在就不会重新 clone），脚本直接删掉。
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR" ]; then
            echo "== existing p4a detected, checking version =="
            if grep -rq '3\.14' "$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py" 2>/dev/null; then
              echo "!! found hostpython3 = 3.14.x, removing stale p4a to force re-clone"
              rm -rf "$P4A_DIR"
            fi
          fi
          # 同时清掉可能残留的 3.14 构建产物/虚拟环境，避免旧 venv 被复用
          rm -rf "$HOME/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv" || true

          buildozer -v android debug
        env:
          # 双保险：即使子进程重新推导 pkg-config，也不会读到宿主配置
          PKG_CONFIG_LIBDIR: ""
          PKG_CONFIG_PATH: ""

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-renamer-apk
          path: bin/*.apk