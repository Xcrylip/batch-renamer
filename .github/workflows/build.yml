name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            build-essential \
            make \
            gcc \
            g++ \
            libffi-dev \
            zlib1g-dev \
            libssl-dev \
            python3-pip \
            python3-dev \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            openjdk-17-jdk \
            autoconf-archive \
            gettext \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            tk-dev \
            libdb-dev

      - name: Verify autotools installation
        run: |
          echo "=== autoconf ==="
          autoconf --version | head -1
          echo "=== automake ==="
          automake --version | head -1
          echo "=== libtool ==="
          libtool --version | head -1
          echo "=== libtoolize ==="
          which libtoolize || echo "libtoolize not found"
          echo "=== m4 ==="
          m4 --version | head -1

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_HOME ANDROID_SDK_ROOT
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-renamer-apk
          path: bin/*.apk